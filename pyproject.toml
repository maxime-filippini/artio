[project]
name = "artio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Maxime Filippini", email = "maxime.filippini@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "polars>=1.42.1",
    "pydantic>=2.0",
    "tomli-w>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
artio = { workspace = true }

[dependency-groups]
dev = [
    "artio",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[project.scripts]
artio = "artio.cli:cli"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ty.environment]
root = ["src"]
